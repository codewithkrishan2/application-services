spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# 64 bytes decoded, which is the minimum for HS512. The previous value decoded to 63 and would now fail
# startup - the point of that check being that a short key silently weakened the signature instead.
security:
  jwt:
    secret: Y29kZXJldi10ZXN0LW9ubHktc2lnbmluZy1rZXktZG8tbm90LXVzZS1hbnl3aGVyZS1lbHNlLTY0LWJ5dGVzIQ==
    access-token-expiration: 900
    refresh-token-expiration: 2592000

app:
  security:
    allowed-origins: http://localhost:3000
    expose-api-docs: true

github:
  oauth:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/coderev/api/v1/oauth/github/callback

bitbucket:
  oauth:
    client-id: test-bitbucket-oauth-client-id
    client-secret: test-bitbucket-oauth-client-secret
    redirect-uri: http://localhost:8080/coderev/api/v1/oauth/bitbucket/callback

# Module 2 - SCM Provider Integration (tests)
#
# Fixed, well-known values so tests can assert on them. The webhook secrets in particular
# are used to compute expected HMAC signatures in the webhook tests, so changing them will
# change those expectations.
scm:
  secrets:
    encryption-key: c2NtLWRldi1vbmx5LWtleS0zMi1ieXRlcy1sb25nISE=
    key-version: 1

  http:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

  seed:
    enabled: true

  providers:
    github:
      client-id: test-github-client-id
      client-secret: test-github-client-secret
      redirect-uri: http://localhost:8080/coderev/api/v1/scm/connections/callback/GITHUB
      webhook-secret: test-github-webhook-secret

    bitbucket:
      client-id: test-bitbucket-client-id
      client-secret: test-bitbucket-client-secret
      redirect-uri: http://localhost:8080/coderev/api/v1/scm/connections/callback/BITBUCKET
      webhook-secret: test-bitbucket-webhook-secret
