server:
  servlet:
    # Every endpoint is served beneath this prefix, so the API base becomes
    # http://localhost:8080/coderev/api/v1 and Swagger UI moves to /coderev/swagger-ui.html.
    #
    # The prefix is stripped by the container before Spring sees the request, which is why no controller
    # mapping, Spring Security matcher or springdoc path pattern mentions it. What it does affect is every
    # URL this application hands to an outside party: the OAuth redirect URIs below, and any webhook URL
    # registered with a provider. Those are absolute, so they must carry the prefix explicitly.
    context-path: ${SERVER_CONTEXT_PATH:/coderev}

spring:
  application:
    name: applicationServices

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Security / JWT
security:
  jwt:
    secret: ${JWT_SECRET:BkJxqiVyEijorcsnRlOyCrWSq26My/I5rkRlwR1YJDh03qByNs1U7yx3qtaPn4V/BXayh51EKZlTW6MuZ2NDHNSZrD8nuo3K7NFcS1KoThQ=}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000}

# ---------------------------------------------------------------------------
# Sign-in providers (Module 1 identity)
#
# One block per provider, read by the matching OAuthLoginProvider bean. The flow itself is shared, so
# adding a provider means adding a block here plus one class - nothing in the flow changes.
#
# The redirect URI must be registered with the provider exactly as written, and must point at
# /api/v1/oauth/{provider}/callback, because that is the path the controllers expose.
# ---------------------------------------------------------------------------
github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:Ov23linGo4vogHg5ckk9}
    client-secret: ${GITHUB_CLIENT_SECRET:d1f7491dde83b450f86e74b5bf27b67f7ac1e908}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/coderev/api/v1/oauth/github/callback}

bitbucket:
  oauth:
    # Atlassian 3LO OAuth consumer ("CodeRev"). Unlike GitHub, the scopes this consumer may request are
    # chosen in Bitbucket's consumer settings rather than in the authorization request, so no scope list
    # appears here. The consumer needs at least the Account (email) permission for sign-in to resolve a
    # user, and its callback URL must equal the redirect-uri below.
    client-id: ${BITBUCKET_CLIENT_ID:7qpM2ib8tGOout0KzbEUva025uEPGtfL}
    client-secret: ${BITBUCKET_CLIENT_SECRET:ATOAjW2WrYOkdRfaHca-8z9MN06PcKBBhwVfFMc4wBwnEws1ki6YzvELOaachDaWK2flC7B496DC}
    redirect-uri: ${BITBUCKET_REDIRECT_URI:http://localhost:8080/coderev/api/v1/oauth/bitbucket/callback}

# Application
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# ---------------------------------------------------------------------------
# Module 2 - SCM Provider Integration
#
# Provider behaviour (API URLs, OAuth endpoints, operations, webhook signature
# scheme, pagination) is NOT configured here. It lives in the database, seeded
# from classpath:scm/seed/*.json. Only secrets and deployment-specific values
# belong in this file, because the database must never hold a client secret.
#
# The property names below are referenced by name from each provider's JSONB
# configuration (clientIdProperty / clientSecretProperty / redirectUriProperty /
# secretProperty), which is how a provider row points at a credential without
# containing it.
# ---------------------------------------------------------------------------
scm:
  secrets:
    # Base64-encoded 256-bit AES key protecting every stored SCM credential.
    # The default is a development key; startup logs a warning while it is in use.
    # MUST be overridden via SCM_SECRETS_ENCRYPTION_KEY in any deployed environment.
    encryption-key: ${SCM_SECRETS_ENCRYPTION_KEY:c2NtLWRldi1vbmx5LWtleS0zMi1ieXRlcy1sb25nISE=}
    key-version: ${SCM_SECRETS_KEY_VERSION:1}

  http:
    connect-timeout-ms: ${SCM_HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SCM_HTTP_READ_TIMEOUT_MS:20000}
    max-response-bytes: ${SCM_HTTP_MAX_RESPONSE_BYTES:10485760}

  seed:
    # Reconciles provider configuration from classpath:scm/seed/*.json at startup.
    # Providers with seed_managed = false are left untouched.
    enabled: ${SCM_SEED_ENABLED:true}

  providers:
    github:
      client-id: ${SCM_GITHUB_CLIENT_ID:${GITHUB_CLIENT_ID:}}
      client-secret: ${SCM_GITHUB_CLIENT_SECRET:${GITHUB_CLIENT_SECRET:}}
      redirect-uri: ${SCM_GITHUB_REDIRECT_URI:http://localhost:8080/coderev/api/v1/scm/connections/callback/GITHUB}
      webhook-secret: ${SCM_GITHUB_WEBHOOK_SECRET:}

    bitbucket:
      # Falls back to the sign-in consumer, mirroring the GitHub entry above, so one registered consumer
      # serves both flows. Note the SCM flow needs broader permissions (repositories, webhooks) than
      # sign-in does, so the consumer must be granted those in Bitbucket for a connection to succeed.
      client-id: ${SCM_BITBUCKET_CLIENT_ID:${BITBUCKET_CLIENT_ID:}}
      client-secret: ${SCM_BITBUCKET_CLIENT_SECRET:${BITBUCKET_CLIENT_SECRET:}}
      redirect-uri: ${SCM_BITBUCKET_REDIRECT_URI:http://localhost:8080/coderev/api/v1/scm/connections/callback/BITBUCKET}
      webhook-secret: ${SCM_BITBUCKET_WEBHOOK_SECRET:}

# Cloudinary
config:
  cloudinary:
    cloud:
      name: ${CLOUDINARY_CLOUD_NAME:djzufbvhc}
      key: ${CLOUDINARY_CLOUD_KEY:376754654687596}
      secret: ${CLOUDINARY_CLOUD_SECRET:ocRrHWoy44hDxYDi_nUrHlhc7cE}

# SpringDoc
springdoc:
  paths-to-match: /api/**
  packages-to-scan: com.kksg.applicationServices.identity.controller, com.kksg.applicationServices.controllers, com.kksg.applicationServices.scm.provider.controller, com.kksg.applicationServices.scm.connection.controller, com.kksg.applicationServices.scm.webhook.controller

# Logging
logging:
  level:
    com.kksg.applicationServices: INFO
    org.springframework.security: WARN
    # SCM integration logs one structured line per provider call (method, URI, status,
    # duration) at INFO. Credentials, request headers and bodies are never logged.
    com.kksg.applicationServices.scm: INFO
